function sampleMic(){if(!analyser)return 0;analyser.getByteTimeDomainData(signal);let rms=0;for(const v of signal)rms+=((v-128)/128)**2;rms=Math.sqrt(rms/signal.length);let goal=clamp((rms-.014)*10,0,.90);micLevel+=(goal-micLevel)*(goal>micLevel?.36:.18);return micLevel;}

function render(t,force){let y=slider('yaw'),r=slider('roll'),e=slider('eye'),m=slider('mouth');if(auto){y+=.26*Math.sin(t*.72)+.12*Math.sin(t*1.3);r+=.22*Math.sin(t*.52+.4);let cycle=Math.floor(t/4.7),cyc=t%4.7;e=Math.max(e,blinkCurve(cyc-(1.5+.75*(1+Math.sin(cycle*2.39)))))}e=Math.max(e,blinkCurve(t-blinkAt));let s=shape;if(talk){m=Math.max(m,.70*Math.pow(Math.max(0,Math.sin(t*10.5)),.8));s=['a','i','o'][Math.floor(t*2)%3]}m=Math.max(m,sampleMic());let gx=slider('gazeX'),gy=slider('gazeY');if(auto){gx+=.23*Math.sin(Math.floor(t/2.8)*2.13)-.25*y;gy+=.14*Math.sin(Math.floor(t/3.4)*1.71)}gx=Math.round(clamp(gx,-1,1)*12)/12;gy=Math.round(clamp(gy,-1,1)*12)/12;const ind=(k,v)=>Math.round(Math.min(1,Math.max(0,v))*(data[k].count-1));let ie=ind('eye0',e),im=ind(s,m),key=ie+':'+s+':'+im+':'+gx+':'+gy;if(key!==lastKey){cc.drawImage(pic,0,0,comp.width,comp.height);function patch(k,n){if(n===0||!atlas)return;let d=data[k],a=d.rect;cc.drawImage(atlas,n*a[2],d.atlasY,a[2],a[3],...a.map(v=>v*scale))}patch('eye0',ie);patch('eye1',ie);patch(s,im);gazePatch(gx,gy,ie/16);lastKey=key}

}function tick(ms){let t=(ms-start)/1000;if(!document.hidden)render(t);fpsN++;if(ms-fpsStart>1000){$('status').textContent=(meshRenderer?'WebGL':'Canvas')+' · '+Math.round(fpsN*1000/(ms-fpsStart))+' fps';fpsN=0;fpsStart=ms}requestAnimationFrame(tick)}function tog(id,b){$(id).classList.toggle('active',b)}$('reset').onclick=()=>{auto=false;talk=false;stopMic();tog('auto',false);tog('talk',false);for(const id of ['yaw','roll','pitch','smile','eye','mouth','gazeX','gazeY']){$(id).value=0;$(id).oninput()}};$('auto').onclick=()=>{auto=!auto;tog('auto',auto)};$('talk').onclick=()=>{talk=!talk;tog('talk',talk)};$('blink').onclick=()=>{blinkAt=(performance.now()-start)/1000};document.querySelectorAll('input').forEach(el=>el.oninput=()=>{el.nextElementSibling.value=el.value});document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{shape=b.dataset.shape;document.querySelectorAll('[data-shape]').forEach(q=>q.classList.toggle('active',q===b))});let drag=false;c.onpointerdown=e=>{drag=true;c.setPointerCapture(e.pointerId);move(e)};c.onpointermove=e=>{if(drag)move(e)};c.onpointerup=c.onpointercancel=()=>drag=false;function move(e){const b=c.getBoundingClientRect();$('yaw').value=Math.round(Math.max(-100,Math.min(100,(e.clientX-b.left-b.width/2)/b.width*200)));$('roll').value=Math.round(Math.max(-100,Math.min(100,(e.clientY-b.top-b.height/2)/b.height*120)));$('yaw').oninput();$('roll').oninput()} window.avatarTest={render:(t)=>{auto=false;talk=false;render(t,true)},ready:()=>ready};init().catch(e=>{$('status').textContent='静止画モード';$('notice').textContent='起動エラー：'+(e.message||String(e));c.hidden=true;$('preview').hidden=false;console.error(e)});
