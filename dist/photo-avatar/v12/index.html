<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Photo Avatar V12 — 3D projection</title><style> *{box-sizing:border-box}body{margin:0;background:#12151b;color:#f2f4f7;font:14px system-ui,sans-serif}main{max-width:650px;margin:auto;padding:12px 12px max(24px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 12px}h1{font-size:20px;margin:0}small,p{color:#aab5c3}canvas,img{display:block;width:100%;height:auto;max-height:59vh;max-height:59svh;object-fit:contain;background:#222831;border-radius:12px;touch-action:none}canvas[hidden],img[hidden]{display:none}section{background:#1d232d;padding:12px;border-radius:12px;margin-top:9px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}button{font:inherit;color:white;background:#303e4b;border:1px solid #526274;border-radius:9px;min-height:44px}button.active{background:#276c70;border-color:#75c6c7}label{display:grid;grid-template-columns:90px 1fr 46px;align-items:center;gap:8px;margin:12px 0}input{width:100%;accent-color:#83d1d0}output{text-align:right;font-variant-numeric:tabular-nums}a{color:#9cdadd}p{line-height:1.6;margin:8px 0}</style><main><header><h1>Photo Avatar V12 <small>3D</small></h1><small id="status">起動中</small></header><img id="preview" alt="元写真"><canvas id="view" width="720" height="1070" hidden></canvas><p id="notice">素材を準備中…</p><section><nav><button id="auto" class="active">自動演技</button><button id="blink">瞬き</button><button id="talk">発話デモ</button><button id="wire">メッシュ表示</button><button id="reset">リセット</button><button id="mic">マイク OFF</button></nav><label>左右回転<input id="yaw" type="range" min="-40" max="40" value="0"><output>0°</output></label><label>上下回転<input id="pitch" type="range" min="-15" max="15" value="0"><output>0°</output></label><label>傾き<input id="roll" type="range" min="-12" max="12" value="0"><output>0°</output></label><label>多視点素材<input id="mix" type="range" min="0" max="100" value="80"><output>80%</output></label><label>目を閉じる<input id="eye" type="range" min="0" max="100" value="0"><output>0%</output></label><label>口を開く<input id="mouth" type="range" min="0" max="100" value="0"><output>0%</output></label><nav><button data-shape="a" class="active">あ</button><button data-shape="i">い</button><button data-shape="u">う</button><button data-shape="e">え</button><button data-shape="o">お</button><button data-shape="n">ん</button></nav><p>実験版：近似的な3D頭部表面と裏側シェル。正面・左右斜めの3素材を頂点UVに投影。マイク音量の処理は端末内のみ。<a href="../v11/">V11（従来方式）</a></p></section></main>
